
name: PHP Laravel CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "SESSION_DRIVER=file" >> .env
          echo "CACHE_STORE=file" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

      - name: Check code style with Pint
        run: ./vendor/bin/pint --test

      - name: Run Laravel feature tests
        run: php artisan test --filter=DictionaryWordTest

      - name: Run unit tests
        run: ./vendor/bin/phpunit tests/Unit

      - name: Check GitHub Secret
        env:
          MY_SECRET: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "GitHub secret is configured"
          else
            echo "GitHub secret is not configured"
          fi
